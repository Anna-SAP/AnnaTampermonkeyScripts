<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sticker</title>
<style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #root svg { display: block; flex: none; }
</style>
<script src="lib.js"></script>
</head>
<body>
<div id="root"></div>
<script>
    // Load only the requested sticker so each sticker file stays independent.
    (function () {
        const id = new URLSearchParams(location.search).get('id') || '';
        if (!/^[a-z0-9-]+$/.test(id)) { document.getElementById('root').textContent = 'bad id'; return; }
        const s = document.createElement('script');
        s.src = 'stickers/' + id + '.js';
        s.onload = () => document.fonts.ready.then(() => STK.render());
        s.onerror = () => { document.getElementById('root').textContent = 'missing sticker: ' + id; };
        document.head.appendChild(s);
    })();
</script>
</body>
</html>
