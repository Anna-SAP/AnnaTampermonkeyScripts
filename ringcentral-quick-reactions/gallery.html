<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Reaction GIFs</title>
<style>
    :root { --bg: #f6f7fb; --fg: #1d1e24; --muted: #6b6f7d; --card: #ffffff; --line: #e3e5ee; }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --bg: #16171b; --fg: #eceef4; --muted: #9a9eab; --card: #1f2026; --line: #30323a; }
    }
    :root[data-theme="dark"] { --bg: #16171b; --fg: #eceef4; --muted: #9a9eab; --card: #1f2026; --line: #30323a; }
    body { margin: 0; padding: 24px 16px 40px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { margin: 0 0 20px; color: var(--muted); }
    .strip { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; border-radius: 12px; margin-bottom: 14px; border: 1px solid var(--line); }
    .light { background: #ffffff; }
    .dark { background: #1e1f24; }
    figure { margin: 0; text-align: center; }
    figure img { display: block; width: 160px; height: 160px; }
    figcaption { font-size: 12px; color: #8b8f9c; margin-top: 4px; }
</style>
</head>
<body>
<h1>RingCentral quick reaction GIFs</h1>
<p>160×160，透明背景，循环播放。上排为浅色聊天背景，下排为深色聊天背景。</p>
<div class="strip light" id="light"></div>
<div class="strip dark" id="dark"></div>
<script>
    const IDS = ['onit', 'working', 'checking', 'thankyou', 'loveit'];
    for (const bg of ['light', 'dark']) {
        const box = document.getElementById(bg);
        for (const id of IDS) {
            const fig = document.createElement('figure');
            fig.innerHTML = `<img src="gifs/${id}.gif" alt="${id}"><figcaption>${id}.gif</figcaption>`;
            box.appendChild(fig);
        }
    }
</script>
</body>
</html>
