<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>页面缩放</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="zoom" role="group" aria-label="页面缩放">
        <button id="zoom-out" type="button" title="缩小（Ctrl + -）" aria-label="缩小">−</button>
        <button id="zoom-level" type="button" title="恢复默认缩放（Ctrl + 0）">100%</button>
        <button id="zoom-in" type="button" title="放大（Ctrl + +）" aria-label="放大">+</button>
    </div>
    <p id="message" hidden></p>
    <script src="popup.js"></script>
</body>
</html>
